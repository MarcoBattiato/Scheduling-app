<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Appointments">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<!-- iOS ignores SVG and manifest icons on the Home Screen; it wants this. -->
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="manifest" href="/static/phone.webmanifest">
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
<title>Appointments</title>
<link rel="stylesheet" href="/static/phone.css">
<!-- Inline, so the very first frame of a Home Screen launch already has the
     app's background instead of a white flash while the stylesheet loads. -->
<style>
html, body { background: #f6f7f9; }
@media (prefers-color-scheme: dark) { html, body { background: #14161a; } }
</style>
</head>
<body>
<!-- First, as on the desktop page: a script that fails to load otherwise
     leaves a screen that looks fine and does nothing. -->
<div id="boot-error"></div>
<script>
window.addEventListener("error", function (e) {
  var box = document.getElementById("boot-error");
  if (!box) return;
  box.style.display = "block";
  box.textContent = "Script error — the page will not work: " + e.message
    + "  (" + String(e.filename || "").split("/").pop() + ":" + e.lineno + ")";
});
window.addEventListener("unhandledrejection", function (e) {
  var box = document.getElementById("boot-error");
  if (!box) return;
  box.style.display = "block";
  box.textContent = "Failed talking to the server: " + (e.reason && e.reason.message || e.reason);
});
</script>

<header class="top">
  <div class="top-who">
    <span id="avatar" class="avatar">·</span>
    <div>
      <div id="who" class="who">…</div>
      <div id="subtitle" class="subtitle"></div>
    </div>
  </div>
  <!-- Stand-in for signing in: switching people is a demo convenience, and is
       labelled as one rather than dressed up as an account menu. -->
  <label class="viewas">
    <span>view as</span>
    <select id="role" aria-label="View as"></select>
  </label>
</header>

<main id="view" class="view"></main>

<nav id="tabs" class="tabs" aria-label="Sections"></nav>
<button id="assistant-button" class="assistant-button" hidden aria-label="Ask the assistant">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.6L18 9l-4.2 1.4L12 15l-1.8-4.6L6 9l4.2-1.4zM18 14l.9 2.1L21 17l-2.1.9L18 20l-.9-2.1L15 17l2.1-.9zM6 15l.7 1.5L8 17l-1.3.5L6 19l-.7-1.5L4 17l1.3-.5z"/></svg>
</button>

<div id="scrim" class="scrim" hidden></div>
<section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="/static/phone.js"></script>
</body>
</html>
