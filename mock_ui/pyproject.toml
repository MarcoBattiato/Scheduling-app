[project]
name = "mock_ui"
version = "0.1.0"
description = "Throwaway browser front end for driving the scheduling engine by hand."
requires-python = ">=3.9"
dependencies = [
    "calendar_store",
    "scheduling_engine",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",   # the simulated payment page posts a form
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]
# Real Stripe Checkout, test mode only. Without it payments are simulated.
stripe = ["stripe>=9"]
# The AI assistant. Without it, or without ANTHROPIC_API_KEY, it says it is not set up.
assistant = ["anthropic>=0.125"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mock_ui = ["static/*"]
