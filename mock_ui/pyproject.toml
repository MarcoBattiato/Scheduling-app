[project]
name = "mock_ui"
version = "0.1.0"
description = "Throwaway browser front end for driving the scheduling engine by hand."
requires-python = ">=3.9"
dependencies = [
    "calendar_store",
    "scheduling_engine",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mock_ui = ["static/*"]
