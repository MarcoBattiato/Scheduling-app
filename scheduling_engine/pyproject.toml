[project]
name = "scheduling_engine"
version = "0.1.0"
description = "Appointment placement and rescheduling: availability segments in, a plan out."
requires-python = ">=3.9"
# calendar_store is deliberately absent. This package takes availability
# segments and returns a plan; it holds nothing and reads nothing, so it has no
# business depending on whatever stores the calendar. The only module that does
# is `playground.py`, a developer harness that stands in for the repository
# adapter — hence the dev extra below.
dependencies = [
    "ortools>=9.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "calendar_store"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
