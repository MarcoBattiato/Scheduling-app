[project]
name = "scheduling_engine"
version = "0.1.0"
description = "Appointment placement and rescheduling negotiation over calendar_store availability."
requires-python = ">=3.9"
dependencies = [
    "calendar_store",
    "ortools>=9.7",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
